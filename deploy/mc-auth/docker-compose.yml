# Run on any small Linux server with Docker:  cp .env.example .env  (fill it in)  &&  docker compose up -d --build
# Open ports 25565/tcp (players), 80 + 443/tcp (HTTPS for the code API). Nothing else.
services:
  mc-oauth:
    build: .
    restart: unless-stopped
    ports:
      - "25565:25565"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [mc-oauth]
    ports:
      - "80:80"
      - "443:443"
    environment:
      AUTH_API_DOMAIN: ${AUTH_API_DOMAIN}
      MC_AUTH_KEY: ${MC_AUTH_KEY}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
