# mc-oauth-rs configuration for Stackr. Copy next to the binary (the Dockerfile does this).
[global]
logging_level = "warn"           # "info" would log every code lookup

[api]
addr = "0.0.0.0"                 # only reachable inside the Docker network (Caddy in front)
port = 8008
code_life_time = 300             # 5 minutes
code_length = 6

[server]
addr = "0.0.0.0"
port = 25565
timeout = 10
# Put the address players type in (MC_JOIN_HOST), e.g. ["auth.example.com"], to reject proxies.
server_ips = []
support_1_19 = false

[server.config]
server_name = "stackr-auth"
protocol = 0                     # follow the client's version
version = "26.3"
auth_url = "https://sessionserver.mojang.com/session/minecraft/hasJoined?username={{NAME}}&serverId={{HASH}}"

[server.status]
description = "§aStackr§r · Anmeldung / sign-in"
players_max = 0
players_online = 0
icon_path = ""

[messages]
success = "§aStackr§r\n\nHallo §6{{NAME}}§r! Dein Code / your code:\n\n§a§l{{CODE}}\n\n§7Gilt 5 Minuten · valid 5 minutes"
bad_session = "§cAnmeldung fehlgeschlagen: Sitzung ungültig. Starte Spiel und Launcher neu.\n§7Sign-in failed: invalid session. Restart game and launcher."
using_proxy = "§cBitte direkt verbinden, ohne Proxy. / Please connect directly, without a proxy."
internal_error = "§cInterner Fehler, bitte später erneut versuchen. / Internal error, try again later."
unsupported_client_version = "§cDiese Minecraft-Version wird nicht unterstützt. / This Minecraft version is not supported."
